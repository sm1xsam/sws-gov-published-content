# Install in the approved public deployment-content repository after initial migration verification.
name: Synchronise Notion articles
run-name: ${{ inputs.request_id && format('Website refresh {0}', inputs.request_id) || 'Scheduled / editorial Notion sync' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Website refresh correlation ID (optional)
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/**'
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
concurrency:
  group: notion-articles-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Install image decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjxl-tools
      - name: Publisher regression and decoder checks
        run: npm test
        env:
          REQUIRE_JXL_DECODER: '1'
  sync:
    needs: verify
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Install image decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjxl-tools
          djxl --version
      - name: Synchronise validated articles
        run: npm run sync
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_ARTICLES_DATA_SOURCE_ID: '4e96226e-ddc9-4a52-ab14-eac0b3f3801c'
          ARTICLES_STORAGE: github
          ARTICLES_GITHUB_REPOSITORY: ${{ github.repository }}
          ARTICLES_GITHUB_TOKEN: ${{ github.token }}
      - name: Explain failed publication
        if: ${{ failure() }}
        run: |
          echo '## Notion publication failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The last validated public snapshot is retained. Inspect the first failed step. For article conversion errors, correct the indicated image or block in Notion and dispatch a fresh run. Unsupported formats and unfinished uploads require source correction; retrying unchanged content will not repair them.' >> "$GITHUB_STEP_SUMMARY"
      # GitHub disables public-repository schedules after 60 days without activity.
      # An occasional empty commit keeps checks active without rewriting article data.
      - name: Keep scheduled publishing checks active
        if: ${{ always() }}
        continue-on-error: true
        run: |
          git fetch --depth=1 origin main
          last_commit=$(git log -1 --format=%ct origin/main)
          if [ $(( $(date +%s) - last_commit )) -gt 2592000 ]; then
            git switch --detach origin/main
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --allow-empty -m 'Keep scheduled Notion publishing checks active'
            git push origin HEAD:main
          fi
